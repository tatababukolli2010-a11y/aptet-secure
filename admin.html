<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRO Admin</title><style>body{font-family:Arial;background:#eef2ff;padding:15px;display:flex;justify-content:center}.box{background:#fff;width:100%;max-width:600px;padding:20px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,.1)} h2{text-align:center;color:#1a73e8} input,select{padding:10px;margin:3px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}.row{display:flex;gap:5px;margin:5px 0} button{padding:10px 12px;border:none;border-radius:8px;background:#1a73e8;color:#fff;cursor:pointer}.del{background:#e53935}.item{background:#f6f7fb;padding:10px;margin:6px 0;border-radius:10px;display:flex;justify-content:space-between;align-items:center}.code{background:#111;color:#0f0;padding:12px;border-radius:8px;white-space:pre-wrap;font-size:11px;word-break:break-all;margin-top:15px} </style></head><body><div class="box"><h2>PRO Admin Panel</h2><div id="loginBox"><input id="adminPwd" type="password" placeholder="Admin Password - Admin@2026"><button style="width:100%;margin-top:5px" onclick="login()">Login</button></div><div id="mainBox" style="display:none"><div class="row"><input id="mobile" placeholder="Mobile - ex: 9876543210"><input id="sname" placeholder="Name - ex: Ramesh"></div><div class="row"><input id="spwd" placeholder="Password - ex: TET1234"><select id="active"><option value="true">Active - Yes</option><option value="false">Active - No</option></select></div><button style="width:100%;background:#0d9d0d" onclick="addUser()">+ Add / Update User</button><div id="list" style="margin-top:15px;max-height:300px;overflow:auto"></div><button style="width:100%;margin-top:15px;background:#ff6d00" onclick="gen()">Generate New users.js Code</button><div id="out"></div></div></div><script src="users.js"></script><script>
let USERS_DATA = typeof USERS!=='undefined'?{...USERS}:{};
function login(){if(document.getElementById('adminPwd').value=== (typeof ADMIN_PASSWORD!=='undefined'?ADMIN_PASSWORD:'Admin@2026')){document.getElementById('loginBox').style.display='none';document.getElementById('mainBox').style.display='block';render()}else{alert('Wrong Password!')}}
function render(){let l=document.getElementById('list');l.innerHTML='';Object.keys(USERS_DATA).forEach(m=>{let u=USERS_DATA[m];l.innerHTML+=`<div class="item"><div><b>${m}</b><br><small>${u.name} | ${u.pwd} | ${u.active?'✅':'❌'}</small></div><div><button onclick="editUser('${m}')">Edit</button><button class="del" onclick="delUser('${m}')">X</button></div></div>`})}
function addUser(){let m=document.getElementById('mobile').value.trim(),n=document.getElementById('sname').value.trim()||"Student",p=document.getElementById('spwd').value.trim()||("TET"+m.slice(-4)),a=document.getElementById('active').value==='true';if(m.length<10){alert('Mobile 10 digits');return} USERS_DATA[m]={name:n,pwd:p,active:a};document.getElementById('mobile').value='';document.getElementById('sname').value='';document.getElementById('spwd').value='';render()}
function delUser(m){if(confirm(m+' delete చేయాలా?')){delete USERS_DATA[m];render()}} function editUser(m){let u=USERS_DATA[m];document.getElementById('mobile').value=m;document.getElementById('sname').value=u.name;document.getElementById('spwd').value=u.pwd;document.getElementById('active').value=u.active}
function gen(){let code=`const USERS = ${JSON.stringify(USERS_DATA,null,2)};\n\nconst ADMIN_PASSWORD = "${typeof ADMIN_PASSWORD!=='undefined'?ADMIN_PASSWORD:'Admin@2026'}";`;document.getElementById('out').innerHTML=`<div class="code">${code}</div><button style="width:100%;margin-top:5px" onclick="navigator.clipboard.writeText(\`${code.replace(/`/g,'\\`')}\`).then(()=>alert('Copied! users.js లో Paste చేయండి'))">📋 Copy Code</button><p style="color:red;font-size:12px">1. Copy నొక్కండి<br>2. GitHub లో users.js Edit చేసి Paste చేసి Commit నొక్కండి<br>3. 1 నిమిషంలో అప్డేట్ అవుతుంది</p>`}
</script></body></html>
